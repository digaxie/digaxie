<svg width="100%" height="180" viewBox="0 0 854 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#1A1B26" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="854" height="180" rx="16" fill="url(#bgGrad)" stroke="#24283B" stroke-width="1.5" />

  <!-- Wave Accent -->
  <path d="M0,120 C160,160 340,80 500,130 C660,180 740,110 854,140 L854,180 L0,180 Z" fill="url(#grad)" opacity="0.12" />
  <path d="M0,140 C200,180 400,120 600,160 C720,185 790,145 854,160 L854,180 L0,180 Z" fill="url(#grad)" opacity="0.25" />

  <!-- Glow Dot / Ambient -->
  <circle cx="427" cy="40" r="50" fill="url(#grad)" opacity="0.15" filter="url(#glow)" />

  <!-- Content -->
  <g text-anchor="middle">
    <!-- Main Title -->
    <text x="427" y="82" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="2">digaxie</text>
    
    <!-- Gradient Accent Line -->
    <rect x="377" y="98" width="100" height="3" rx="1.5" fill="url(#grad)" />

    <!-- Subtitle -->
    <text x="427" y="132" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="1">Systems &amp; Tools  •  DPI Engines  •  Desktop Optimization</text>
  </g>
</svg>
